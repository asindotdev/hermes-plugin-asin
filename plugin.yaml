name: asin
version: 1.1.0
description: "Amazon prices for Hermes: search 11 Amazon stores, read a product's price history and seller offers, and keep a watchlist that checks prices on a schedule and emails on drops, through the Asin API."
author: Asin
license: MIT
requires_hermes: ">=0.21.6"
provides_tools:
  - asin_search_amazon
  - asin_price_history
  - asin_get_offers
  - asin_read_offers
  - asin_track_product
  - asin_list_tracked
  - asin_tracked_product
  - asin_update_tracking
  - asin_check_now
  - asin_stop_tracking
  - asin_account
provides_hooks: []
provides_middleware: []
requires_env:
  - name: ASIN_API_KEY
    description: Asin API key
    url: https://www.asin.dev/app
    secret: true
config_schema:
  api_key:
    type: secret
    env: ASIN_API_KEY
    label: Asin API key
